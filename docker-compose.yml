services:
  webserver:
    # Variante d'image : bin/php82 (mod_php + prefork) par defaut, ou
    # bin/php82-fpm (PHP-FPM + mpm_event). Bascule et retour arriere par .env,
    # sans toucher a ce fichier : cf. README, "Apache event + PHP-FPM".
    build:
      context: ${WEBSERVER_BUILD-./bin/php82}
    image: ${WEBSERVER_IMAGE-${COMPOSE_PROJECT_NAME}-webserver}
    container_name: "${COMPOSE_PROJECT_NAME}-webserver"
    restart: "always"
    ports:
      - "${HOST_MACHINE_UNSECURE_HOST_PORT}:80"
      - "${HOST_MACHINE_SECURE_HOST_PORT}:443"
    links:
      - database
    volumes:
      - ${DOCUMENT_ROOT-./www}:/var/www/html:rw
      - ${PHP_INI-./config/php/php.ini}:/usr/local/etc/php/php.ini
      # Reglages des deux variantes, montes pour etre ajustes sans rebuild ;
      # chaque image ignore ceux de l'autre (module ou FPM absent).
      - ./bin/php82/mpm_prefork.conf:/etc/apache2/mods-available/mpm_prefork.conf:ro
      - ./bin/php82-fpm/mpm_event.conf:/etc/apache2/mods-available/mpm_event.conf:ro
      - ./bin/php82-fpm/pool.conf:/usr/local/etc/php-fpm.d/zz-lamp.conf:ro
      - ${SSL_DIR-./config/ssl}:/etc/apache2/ssl/
      - ${SSL_DIR-./config/ssl}/letsencrypt:/etc/letsencrypt/
      - ${VHOSTS_DIR-./config/vhosts}:/etc/apache2/sites-enabled
      - ${LOG_DIR-./logs/apache2}:/var/log/apache2
      - ${XDEBUG_LOG_DIR-./logs/xdebug}:/var/log/xdebug
    environment:
      APACHE_DOCUMENT_ROOT: ${APACHE_DOCUMENT_ROOT-/var/www/html}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
  database:
    build:
      context: "./bin/mysql8"
    container_name: "${COMPOSE_PROJECT_NAME}-database"
    restart: "always"
    ports:
      - "127.0.0.1:${HOST_MACHINE_MYSQL_PORT}:3306"
    volumes:
      - ${MYSQL_INITDB_DIR-./config/initdb}:/docker-entrypoint-initdb.d
      - ${MYSQL_DATA_DIR-./data/mysql}:/var/lib/mysql
      - ${MYSQL_LOG_DIR-./logs/mysql}:/var/log/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD manquant dans .env}"]
    container_name: "${COMPOSE_PROJECT_NAME}-redis"
    restart: "always"
    ports:
      - "127.0.0.1:${HOST_MACHINE_REDIS_PORT}:6379"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
  adminer:
    # Bind sur 127.0.0.1 : joignable uniquement via un tunnel SSH
    # (`make adminer VPS=user@ip`), jamais depuis Internet. Ne passe pas par
    # Apache, donc aucun vhost ne peut le republier par accident.
    image: adminer:6
    container_name: "${COMPOSE_PROJECT_NAME}-adminer"
    restart: "always"
    ports:
      - "127.0.0.1:${HOST_MACHINE_ADMINER_PORT-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: database
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
  # Monitoring Beszel, dans le profil `monitoring` : ne demarre que si .env
  # contient COMPOSE_PROFILES=monitoring, donc rien ne tourne en local.
  # Hub (interface, historique, alertes) bind sur 127.0.0.1 comme adminer,
  # joignable par `make beszel VPS=user@ip`.
  beszel:
    image: henrygd/beszel:0.21.0
    container_name: "${COMPOSE_PROJECT_NAME}-beszel"
    profiles: ["monitoring"]
    restart: "always"
    ports:
      - "127.0.0.1:${HOST_MACHINE_BESZEL_PORT-8090}:8090"
    environment:
      APP_URL: "http://127.0.0.1:${HOST_MACHINE_BESZEL_PORT-8090}"
    volumes:
      - ./data/beszel/hub:/beszel_data
      - ./data/beszel/socket:/beszel_socket
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
  # Reseau host pour mesurer les vraies interfaces de la machine, socket Docker
  # pour les stats de chaque conteneur. Parle au hub par le socket unix partage :
  # aucun port ouvert.
  beszel-agent:
    image: henrygd/beszel-agent:0.21.0
    container_name: "${COMPOSE_PROJECT_NAME}-beszel-agent"
    profiles: ["monitoring"]
    restart: "always"
    network_mode: host
    volumes:
      - ./data/beszel/agent:/var/lib/beszel-agent
      - ./data/beszel/socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: "http://127.0.0.1:${HOST_MACHINE_BESZEL_PORT-8090}"
      TOKEN: ${BESZEL_AGENT_TOKEN-}
      KEY: ${BESZEL_AGENT_KEY-}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
  node:
    image: node:18
    container_name: "${COMPOSE_PROJECT_NAME}-node"
    restart: "always"
    init: true
    volumes:
      - ${DOCUMENT_ROOT-./www}:/www
    working_dir: /www
    tty: ${NODE_TTY-false}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
