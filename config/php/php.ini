; ---------------------------------------------------------------------------
; php.ini de PRODUCTION.
;
; C'est le fichier monte par defaut (docker-compose.yml :
; ${PHP_INI-./config/php/php.ini}), donc oublier de definir PHP_INI dans .env
; retombe sur la config durcie, jamais l'inverse.
;
; Pour le dev local, .env pointe PHP_INI vers ./config/php/php-local.ini,
; genere par `make init` depuis templates/php/php-local.ini.
; ---------------------------------------------------------------------------

memory_limit = 256M
post_max_size = 100M
upload_max_filesize = 100M

; --- Erreurs ---
; Laravel intercepte les exceptions, mais pas les erreurs fatales d'avant le
; boot (parse error, echec de connexion DB au demarrage, OOM) : c'est la que
; fuient les chemins absolus et parfois les credentials, et APP_DEBUG=false
; n'en protege pas.
; error_log reste volontairement non defini : en mod_php, PHP route alors ses
; erreurs vers le log Apache, deja monte sur ./logs/apache2/error.log. On perd
; l'affichage, pas la trace.
display_errors = Off
display_startup_errors = Off
log_errors = On
expose_php = Off

; --- Sessions ---
; Sans effet sur les applis Laravel : elles construisent leurs cookies
; elles-memes depuis config/session.php (http_only / secure / same_site).
; Ces valeurs protegent les scripts PHP hors framework.
; cookie_secure = 1 suppose que tous les vhosts sont bien en HTTPS.
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1

; NE PAS ajouter disable_functions ici : ce fichier est monte sur
; /usr/local/etc/php/php.ini, il s'applique donc aussi au SAPI CLI et
; casserait artisan queue:work, schedule:run et composer (Symfony Process).
; disable_functions est PHP_INI_SYSTEM, il n'est pas reglable par vhost.
; Le cloisonnement entre sites passe par open_basedir (PHP_INI_ALL), pose
; par vhost dans config/vhosts/.
