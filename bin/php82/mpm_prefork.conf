# Monte par docker-compose.yml sur /etc/apache2/mods-available/mpm_prefork.conf,
# plutot que copie dans l'image : ajuster une valeur ne demande qu'un redemarrage.
#
# Prefork + mod_php : un processus par connexion (~35 Mo mesures), et une
# connexion websocket proxifiee vers Reverb garde le sien tant qu'elle reste
# ouverte. Les 150 workers par defaut depassent de loin 1 Go de RAM. Au-dela de
# MaxRequestWorkers, les connexions attendent leur tour au lieu de faire swapper
# la machine.
<IfModule mpm_prefork_module>
	StartServers             2
	MinSpareServers          2
	MaxSpareServers          5
	MaxRequestWorkers        40
	MaxConnectionsPerChild   1000
</IfModule>
