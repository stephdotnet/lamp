# Equivalent du docker-php.conf de l'image php:apache, avec PHP-FPM (meme
# conteneur, port 9000 de zz-docker.conf) comme handler. Global : aucun vhost
# n'a de handler a declarer.
#
# Le <If -f> ne transmet a FPM qu'un fichier qui existe : un .php inconnu reste
# un 404 d'Apache au lieu d'un "Primary script unknown" de FPM.
<FilesMatch \.php$>
    <If "-f %{REQUEST_FILENAME}">
        SetHandler "proxy:fcgi://127.0.0.1:9000"
    </If>
</FilesMatch>

# PHP-FPM garde dans le processus une valeur recue en PHP_ADMIN_VALUE pour les
# requetes suivantes (mod_php la remettait a zero) : un site sans open_basedir,
# servi apres un site isole, heriterait du sien et ne trouverait plus ses
# fichiers. Cette valeur vide, posee sur chaque requete, l'efface ; les vhosts
# qui en declarent une (macro LaravelSiteBody) la remplacent.
SetEnv PHP_ADMIN_VALUE "open_basedir="

DirectoryIndex disabled
DirectoryIndex index.php index.html

<Directory /var/www/>
    Options -Indexes
    AllowOverride All
</Directory>
