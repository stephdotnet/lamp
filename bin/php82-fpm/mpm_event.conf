# Monte par docker-compose.yml sur /etc/apache2/mods-available/mpm_event.conf
# (ignore par l'image prefork, ou le module n'est pas actif).
#
# Une websocket proxifiee vers Reverb garde un thread tant qu'elle est ouverte,
# meme en mpm_event : MaxRequestWorkers plafonne donc les joueurs connectes.
# Un thread ne coute presque rien : 600 websockets ont pese ~110 Mo au total
# (Apache + FPM). 8 processus x 128 threads = 1024 connexions simultanees.
# PHP n'est pas ici mais dans le pool FPM (pool.conf), plafonne a part. Une
# connexion keep-alive inactive, elle, ne garde pas de thread.
<IfModule mpm_event_module>
	StartServers             1
	ServerLimit              8
	ThreadLimit              128
	ThreadsPerChild          128
	MaxRequestWorkers        1024
	MinSpareThreads          32
	MaxSpareThreads          256
	MaxConnectionsPerChild   0
</IfModule>
