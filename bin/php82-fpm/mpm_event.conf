# Monte par docker-compose.yml sur /etc/apache2/mods-available/mpm_event.conf
# (ignore par l'image prefork, ou le module n'est pas actif).
#
# Une connexion, websocket comprise, ne coute qu'un thread de quelques dizaines
# de Ko : 4 processus x 64 threads = 256 connexions simultanees. PHP n'est plus
# ici mais dans le pool FPM (pool.conf), plafonne a part. Une connexion
# keep-alive inactive ne garde pas de thread en mpm_event : le KeepAliveTimeout
# de 5 s d'apache2.conf peut rester.
<IfModule mpm_event_module>
	StartServers             1
	ServerLimit              4
	ThreadLimit              64
	ThreadsPerChild          64
	MaxRequestWorkers        256
	MinSpareThreads          16
	MaxSpareThreads          96
	MaxConnectionsPerChild   0
</IfModule>
