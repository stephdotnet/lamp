; Monte par docker-compose.yml sur /usr/local/etc/php-fpm.d/zz-lamp.conf, lu
; apres zz-docker.conf (qui garde `listen = 9000`).
;
; Le seul plafond de PHP : 8 processus (~40 Mo chacun, ~320 Mo au pire) pour tous
; les sites. Au-dela, les requetes PHP attendent leur tour, les websockets et les
; fichiers statiques non. Recycles toutes les 500 requetes contre les fuites.
[www]
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; mod_php voyait l'environnement du conteneur (getenv) : on le garde
clear_env = no
