; ---------------------------------------------------------------------------
; php.ini de DEV LOCAL.
;
; Copie dans config/php/ par `make init` (config/ est gitignore, la source de
; verite versionnee est ce fichier).
; Active par PHP_INI=./config/php/php-local.ini dans .env.
;
; La reference durcie est config/php/php.ini.
; ---------------------------------------------------------------------------

memory_limit = 256M
post_max_size = 100M
upload_max_filesize = 100M

; --- Erreurs : tout afficher, c'est le but en local ---
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
expose_php = On

; --- Sessions ---
; cookie_secure reste a 0 : le dev tourne en http://*.localhost, un cookie
; Secure n'y serait jamais renvoye par le navigateur.
session.cookie_httponly = 1
session.cookie_secure = 0
session.use_strict_mode = 1
